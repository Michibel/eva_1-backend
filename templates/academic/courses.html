<!-- templates/academic/courses.html -->
<!-- Página de gestión de cursos con CRUD completo -->

{% extends 'academic/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📚 Gestión de Cursos</h2>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createCourseModal">
        <i class="fas fa-plus"></i> Nuevo Curso
    </button>
</div>

<!-- Tabla de cursos -->
<table class="table table-striped table-bordered" id="courses-table">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre del Curso</th>
            <th>Profesor</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="courses-list">
        <tr>
            <td colspan="4" class="text-center">⏳ Cargando datos...</td>
        </tr>
    </tbody>
</table>

<!-- ============================================ -->
<!-- MODAL: CREAR CURSO -->
<!-- ============================================ -->
<div class="modal fade" id="createCourseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Crear Nuevo Curso</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="createCourseForm">
                    <div class="mb-3">
                        <label for="createCourseName" class="form-label">Nombre del Curso</label>
                        <input type="text" class="form-control" id="createCourseName" required>
                    </div>
                    <div class="mb-3">
                        <label for="createCourseTeacher" class="form-label">Profesor</label>
                        <select class="form-control" id="createCourseTeacher" required>
                            <option value="">Seleccione un profesor...</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="saveCourseBtn">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================ -->
<!-- MODAL: EDITAR CURSO -->
<!-- ============================================ -->
<div class="modal fade" id="editCourseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Curso</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editCourseForm">
                    <input type="hidden" id="editCourseId">
                    <div class="mb-3">
                        <label for="editCourseName" class="form-label">Nombre del Curso</label>
                        <input type="text" class="form-control" id="editCourseName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editCourseTeacher" class="form-label">Profesor</label>
                        <select class="form-control" id="editCourseTeacher" required>
                            <option value="">Seleccione un profesor...</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="updateCourseBtn">
                    <i class="fas fa-save"></i> Actualizar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================ -->
<!-- MODAL: CONFIRMAR ELIMINACIÓN -->
<!-- ============================================ -->
<div class="modal fade" id="deleteCourseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger">⚠️ Confirmar Eliminación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de que deseas eliminar el curso <strong id="deleteCourseName"></strong>?</p>
                <p class="text-danger"><small>Esta acción no se puede deshacer.</small></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteCourseBtn">
                    <i class="fas fa-trash"></i> Eliminar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================ -->
<!-- JAVASCRIPT: CRUD COMPLETO -->
<!-- ============================================ -->
<script>
    // ============================================
    // VARIABLES GLOBALES
    // ============================================
    let currentDeleteCourseId = null;
    let teachersList = [];

    // ============================================
    // FUNCIÓN: CARGAR PROFESORES PARA SELECTS
    // ============================================
    async function loadTeachersForSelects() {
        try {
            const response = await fetch('/api/teachers/');
            if (!response.ok) throw new Error('Error al cargar profesores');
            teachersList = await response.json();
            
            // Llenar selects
            const selects = ['createCourseTeacher', 'editCourseTeacher'];
            selects.forEach(id => {
                const select = document.getElementById(id);
                // Mantener el primer elemento (Seleccione...)
                const firstOption = select.options[0];
                select.innerHTML = '';
                select.appendChild(firstOption);
                
                teachersList.forEach(teacher => {
                    const option = document.createElement('option');
                    option.value = teacher.id;
                    option.textContent = `${teacher.first_name} ${teacher.last_name}`;
                    select.appendChild(option);
                });
            });
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // ============================================
    // FUNCIÓN: CARGAR CURSOS
    // ============================================
    async function loadCourses() {
        const tbody = document.getElementById('courses-list');
        try {
            const response = await fetch('/api/courses/');
            if (!response.ok) throw new Error(`Error: ${response.status}`);
            const courses = await response.json();

            tbody.innerHTML = '';

            if (courses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center">No hay cursos disponibles.</td></tr>`;
                return;
            }

            courses.forEach(course => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${course.id}</td>
                    <td>${course.name}</td>
                    <td>${course.teacher_name || 'Sin asignar'}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-sm btn-edit" onclick="openEditCourse(${course.id}, '${course.name}', ${course.teacher})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-delete" onclick="openDeleteCourse(${course.id}, '${course.name}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        } catch (error) {
            console.error('Error:', error);
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">❌ Error al cargar los datos.</td></tr>`;
        }
    }

    // ============================================
    // FUNCIÓN: CREAR CURSO
    // ============================================
    document.getElementById('saveCourseBtn').addEventListener('click', async function() {
        const name = document.getElementById('createCourseName').value.trim();
        const teacherId = document.getElementById('createCourseTeacher').value;

        if (!name || !teacherId) {
            showToast('Por favor, completa todos los campos.', 'warning');
            return;
        }

        try {
            const response = await fetch('/api/courses/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, teacher: parseInt(teacherId) })
            });

            if (!response.ok) throw new Error('Error al crear el curso');

            const modal = bootstrap.Modal.getInstance(document.getElementById('createCourseModal'));
            modal.hide();

            document.getElementById('createCourseName').value = '';
            document.getElementById('createCourseTeacher').value = '';

            await loadCourses();
            showToast('✅ Curso creado exitosamente.', 'success');
        } catch (error) {
            console.error('Error:', error);
            showToast('❌ Error al crear el curso.', 'error');
        }
    });

    // ============================================
    // FUNCIÓN: ABRIR MODAL DE EDICIÓN
    // ============================================
    function openEditCourse(id, name, teacherId) {
        document.getElementById('editCourseId').value = id;
        document.getElementById('editCourseName').value = name;
        document.getElementById('editCourseTeacher').value = teacherId;
        
        const modal = new bootstrap.Modal(document.getElementById('editCourseModal'));
        modal.show();
    }

    // ============================================
    // FUNCIÓN: ACTUALIZAR CURSO
    // ============================================
    document.getElementById('updateCourseBtn').addEventListener('click', async function() {
        const id = document.getElementById('editCourseId').value;
        const name = document.getElementById('editCourseName').value.trim();
        const teacherId = document.getElementById('editCourseTeacher').value;

        if (!name || !teacherId) {
            showToast('Por favor, completa todos los campos.', 'warning');
            return;
        }

        try {
            const response = await fetch(`/api/courses/${id}/`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, teacher: parseInt(teacherId) })
            });

            if (!response.ok) throw new Error('Error al actualizar el curso');

            const modal = bootstrap.Modal.getInstance(document.getElementById('editCourseModal'));
            modal.hide();

            await loadCourses();
            showToast('✅ Curso actualizado exitosamente.', 'success');
        } catch (error) {
            console.error('Error:', error);
            showToast('❌ Error al actualizar el curso.', 'error');
        }
    });

    // ============================================
    // FUNCIÓN: ABRIR MODAL DE ELIMINACIÓN
    // ============================================
    function openDeleteCourse(id, name) {
        currentDeleteCourseId = id;
        document.getElementById('deleteCourseName').textContent = name;
        
        const modal = new bootstrap.Modal(document.getElementById('deleteCourseModal'));
        modal.show();
    }

    // ============================================
    // FUNCIÓN: ELIMINAR CURSO
    // ============================================
    document.getElementById('confirmDeleteCourseBtn').addEventListener('click', async function() {
        if (!currentDeleteCourseId) return;

        try {
            const response = await fetch(`/api/courses/${currentDeleteCourseId}/`, {
                method: 'DELETE'
            });

            if (!response.ok) throw new Error('Error al eliminar el curso');

            const modal = bootstrap.Modal.getInstance(document.getElementById('deleteCourseModal'));
            modal.hide();

            await loadCourses();
            showToast('✅ Curso eliminado exitosamente.', 'success');
        } catch (error) {
            console.error('Error:', error);
            showToast('❌ Error al eliminar el curso.', 'success');
        }
    });

    // ============================================
    // INICIALIZAR
    // ============================================
    document.addEventListener('DOMContentLoaded', async function() {
        await loadTeachersForSelects();
        await loadCourses();
    });
</script>
{% endblock %}
